name = "appstore-lowest-price"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# OpenNext for Cloudflare：worker 入口（必须在 [assets] 之前，保持顶级字段）
main = ".open-next/worker.js"

# 静态资源（Next.js 静态导出部分）
[assets]
directory = ".open-next/assets"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "appstore-price"
database_id = "15e915b3-5ba0-40a3-9602-57cf2db1aef2"

[observability]
enabled = true

# 首页 Claude 演示区数据保活：
# GitHub Actions 定时调 /api/admin/refresh-claude-demo（每 6h），见
#   .github/workflows/refresh-claude-demo.yml
# 需在 GitHub repo Settings > Secrets 配置：
#   SITE_URL   = https://appstore-lowest-price.alifeiliu.workers.dev
#   ADMIN_TOKEN = (与 Cloudflare env.ADMIN_TOKEN 一致)
