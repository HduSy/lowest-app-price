name = "appstore-lowest-price"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# OpenNext for Cloudflare：worker 入口（必须在 [assets] 之前，保持顶级字段）
main = ".open-next/worker.js"

# 静态资源（Next.js 静态导出部分）
[assets]
directory = ".open-next/assets"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "appstore-price"
database_id = "15e915b3-5ba0-40a3-9602-57cf2db1aef2"

[observability]
enabled = true

# Cron Triggers：定时刷新首页 Claude 演示区价格数据
# OpenNext 不支持 scheduled handler，用外部 cron 调 admin 端点替代：
#   curl "https://appstore-lowest-price.alifeiliu.workers.dev/api/admin/refresh-claude-demo?token=$ADMIN_TOKEN"
# 建议每 6 小时执行一次（与 PRICE_TTL_HOURS 一致）
# 如需启用 Cloudflare 原生 cron，取消下方注释并实现 scheduled handler：
# [triggers]
# crons = ["0 */6 * * *"]
