name = "lowest-app-price"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# OpenNext for Cloudflare：worker 入口（必须在 [assets] 之前，保持顶级字段）
main = ".open-next/worker.js"

# 静态资源（Next.js 静态导出部分）
[assets]
directory = ".open-next/assets"

# D1 数据库绑定
# binding 名固定为 DB（代码里 getDb() 读 ctx.env.DB，改 binding 要动代码）
# database_name/id 指向新库 lowest-app-price（旧库 appstore-price 已弃用，未迁移数据）
[[d1_databases]]
binding = "DB"
database_name = "lowest-app-price"
database_id = "3d626a5c-9b0f-43e6-ae62-496f85aa044e"

[observability]
enabled = true

# 定价 A/B 实验开关（A=付费三档：未登录锁定/登录3次每天/$1.99买断；B=免费：未登录top3锁定/登录即会员）
# 切换改这里后重新 deploy
[vars]
PRICING_VARIANT = "B"

# 首页 Claude 演示区数据保活：
# GitHub Actions 定时调 /api/admin/refresh-claude-demo（每 6h），见
#   .github/workflows/refresh-claude-demo.yml
# 需在 GitHub repo Settings > Secrets 配置：
#   SITE_URL   = https://lowestappprice.com
#   ADMIN_TOKEN = (与 Cloudflare env.ADMIN_TOKEN 一致)
